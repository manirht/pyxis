name: Request collaborator reviews

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: write

jobs:
  request-reviews:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use only trusted workflow code; never check out the PR with this token.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const collaborators = await github.paginate(github.rest.repos.listCollaborators, {
              ...context.repo, affiliation: 'all', per_page: 100,
            });
            const pull = { ...context.repo, pull_number: pr.number };
            const { data: pending } = await github.rest.pulls.listRequestedReviewers(pull);
            const excluded = new Set([pr.user.login, ...pending.users.map(user => user.login)]
              .map(login => login.toLowerCase()));
            const reviewers = collaborators
              .filter(user => user.permissions.push && !excluded.has(user.login.toLowerCase()))
              .map(user => user.login);
            if (reviewers.length) {
              await github.rest.pulls.requestReviewers({ ...pull, reviewers });
            }
